# Render blueprint: one-click deployment of Raja Scout Intelligence.
# Deploy: https://render.com/deploy?repo=https://github.com/xexino/football-scouting
# This blueprint deploys a PUBLIC DEMO (DEPLOYMENT_MODE=demo): fictional data and demo
# accounts only. A demo deployment refuses to start if its database contains a customer
# organization. Customer environments use a separate service + database with
# DEPLOYMENT_MODE=customer (see docs/DEPLOYMENT.md and docs/saas/04_STAGE3_PRODUCTION.md).
databases:
  - name: raja-scout-db
    plan: free
    region: frankfurt
    databaseName: raja_scout
    user: raja

services:
  - type: web
    name: raja-scout
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: raja-scout-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: RAJA_ENV
        value: production
      - key: DEPLOYMENT_MODE
        value: demo
      - key: WEB_CONCURRENCY
        value: "1"
      # Render's load balancer is the single proxy in front of the app: take the client IP it
      # appends (not the client-supplied left-most X-Forwarded-For entry); trust it for https scheme.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # You are asked for this during deployment: the password of all demo accounts.
      # Choose a strong one - the site is public.
      - key: DEMO_PASSWORD
        sync: false
